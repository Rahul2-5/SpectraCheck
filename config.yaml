# Main experiment defaults from PRD v1.0. Pilot settings stay separate.
seed: 42
image_size: 256
rapsd_rings: 64
pixel_baseline_size: 32
positive_label: 1
preprocess:
  version: 1
  orientation: exif_transpose
  color_conversion: RGB_then_L
  crop: center_square
  resize_filter: LANCZOS
  undersized_policy: reject
  output_dtype: float64
  normalization_divisor: 255.0
frequency:
  hann_window: true
  epsilon: 1.0e-12
  mad_scale: 1.4826
split:
  train: 0.70
  val: 0.15
  test: 0.15
paths:
  data_root: /content/drive/MyDrive/aidetect/data
  features_root: /content/drive/MyDrive/aidetect/features
  reports_root: reports
  artifacts_root: artifacts
dataset:
  main: TheKernel01/Tiny-GenImage
  generator_name: SD15
  max_real: 4000
  source_splits: [train, validation]
  revision: main
  minimum_ai_images: 1000
pilot:
  samples_per_class: 500
  image_size: 32
  source_splits: [train, test]
cv_folds: 5
search_iters: 30
alpha: 0.05
batch_size: 500
extraction:
  peak_k_mad: [3, 4, 5, 6, 8]
audit:
  shortcut_max_accuracy: 0.60
  probe_tree_depth: 3
  probe_logistic_max_iter: 2000
  phash_size: 8
  duplicate_hamming_distance: 4
  histogram_bins: 20
  figure_dpi: 150
splitting:
  proportion_tolerance: 0.01
  solver_time_limit_seconds: 60
training:
  r0:
    min: 8
    max: 120
    step: 8
  model_order: [svm, rf, xgb]
  primary_model_tie_order: [svm, rf, xgb]
  search_n_jobs: 1
  estimator_n_jobs: 1
  feature_importance_top_n: 15
  feature_importance_dpi: 300
  scoring: accuracy
  legacy_phase5_config_hashes:
    - 7ac0df38870f031ee724c7b9b1610d12b02890bd9fd2760adb1215facc498d0f
  phase5_feature_contract_sha256: c92f2dc1292441ab73d65fb67a5a9e1ef63b3a79d2edf4e7764df17e489c47a9
  calibration:
    method: sigmoid
  search_space:
    svm:
      C_loguniform: [0.01, 1000.0]
      gamma_loguniform: [0.0001, 1.0]
    rf:
      n_estimators: [200, 800]
      max_depth: [null, 5, 10, 20]
      min_samples_leaf: [1, 10]
      max_features: [sqrt, 0.3, 0.5]
    xgb:
      n_estimators: [200, 800]
      max_depth: [2, 8]
      learning_rate_uniform: [0.01, 0.3]
      subsample_uniform: [0.6, 1.0]
      colsample_bytree_uniform: [0.5, 1.0]
    xgb_fixed:
      objective: binary:logistic
      eval_metric: logloss
      tree_method: hist
      verbosity: 0
